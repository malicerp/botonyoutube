<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#13151b;overflow:hidden}
#b{position:relative;width:100%;height:100%;box-sizing:border-box;background:#13151b;border:1px solid #2e323d;overflow:hidden;cursor:pointer;color:#e8ecf7}
#t{position:absolute;inset:0;background:center/cover no-repeat;filter:grayscale(1);opacity:.35;transform:scale(1.25)}
#i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.9;font:700 15px Georgia,serif}
svg{width:14px;height:14px;fill:currentColor}
#pa,#er{display:none}
#c{position:absolute;left:-80px;top:-80px;width:200px;height:200px;opacity:.01;pointer-events:none}
</style></head><body>
<div id="b"><div id="t"></div><div id="i">
<svg id="pl" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
<svg id="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
<span id="er">!</span>
</div></div>
<div id="c"><div id="yt"></div></div>
<script>
var vid=new URLSearchParams(location.search).get('v'), player, ready=false;
document.getElementById('t').style.backgroundImage='url(https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg)';
function show(on){
  document.getElementById('pl').style.display=on?'none':'block';
  document.getElementById('pa').style.display=on?'block':'none';
}
function fail(code){
  document.getElementById('pl').style.display='none';
  document.getElementById('pa').style.display='none';
  document.getElementById('er').style.display='block';
  document.getElementById('b').title='Error de YouTube: '+code;
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt',{
    width:200,height:200,videoId:vid,
    playerVars:{controls:0,playsinline:1,rel:0,origin:location.origin},
    events:{
      onReady:function(){ready=true;},
      onStateChange:function(e){show(e.data===1);},
      onError:function(e){fail(e.data);}
    }
  });
};
document.getElementById('b').addEventListener('click',function(){
  if(!ready)return;
  if(player.getPlayerState()===1)player.pauseVideo();
  else player.playVideo();
});
var s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
</body></html>
