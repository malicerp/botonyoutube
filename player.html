<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="light">
<style>
:root{color-scheme:light}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#b{position:relative;width:100%;height:100%;cursor:pointer;overflow:hidden}
#t{display:none;position:absolute;inset:0;background:center/cover no-repeat;filter:grayscale(1);opacity:.5;transform:scale(1.25)}
.show #t{display:block}
#c{position:absolute;left:50%;top:50%;width:320px;height:180px;margin:0;opacity:.01;pointer-events:none;transform:translate(-50%,-50%) scale(.25);transform-origin:center}
#c iframe{width:320px;height:180px;border:0;display:block}
#i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px Georgia,serif;pointer-events:none}
.show #i{filter:drop-shadow(0 0 2px rgba(0,0,0,.85))}
#i svg{width:14px;height:14px;fill:currentColor}
#pa,#er{display:none}
</style></head><body>
<div id="b"><div id="t"></div><div id="c"><div id="yt"></div></div><div id="i">
<svg id="pl" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
<svg id="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
<span id="er">!</span>
</div></div>
<script>
var q=new URLSearchParams(location.search), vid=q.get('v'), showVideo=q.get('show')==='1', player, ready=false;
if(showVideo){
  document.body.className='show';
  document.getElementById('t').style.backgroundImage='url(https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg)';
}
function icon(on){
  document.getElementById('pl').style.display=on?'none':'block';
  document.getElementById('pa').style.display=on?'block':'none';
}
function seeVideo(on){
  if(!showVideo)return;
  document.getElementById('c').style.opacity=on?'1':'.01';
  document.getElementById('t').style.opacity=on?'0':'.5';
}
function fail(code){
  document.getElementById('pl').style.display='none';
  document.getElementById('pa').style.display='none';
  document.getElementById('er').style.display='block';
  document.getElementById('b').title='Error de YouTube: '+code;
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt',{
    width:320,height:180,videoId:vid,
    playerVars:{controls:0,playsinline:1,rel:0,disablekb:1,modestbranding:1,origin:location.origin},
    events:{
      onReady:function(){ready=true;},
      onStateChange:function(e){
        icon(e.data===1);
        seeVideo(e.data===1||e.data===2||e.data===3);
      },
      onError:function(e){fail(e.data);}
    }
  });
};
document.getElementById('b').addEventListener('click',function(){
  if(!ready)return;
  if(player.getPlayerState()===1)player.pauseVideo();
  else player.playVideo();
});
var s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
</body></html>
