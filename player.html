<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="light">
<style>
:root{color-scheme:light}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#c{position:absolute;left:0;top:0;width:320px;height:180px;opacity:.01;pointer-events:none;clip-path:inset(0 282px 142px 0)}
#c iframe{width:320px;height:180px;border:0;display:block}
#b{position:absolute;left:0;top:0;right:0;bottom:0;cursor:pointer}
#i{position:absolute;left:0;top:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px Georgia,serif;pointer-events:none}
#i svg{width:14px;height:14px;fill:currentColor}
#pa,#er{display:none}
</style></head><body>
<div id="c"><div id="yt"></div></div>
<div id="b"></div>
<div id="i">
<svg id="pl" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
<svg id="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
<span id="er">!</span>
</div>
<script>
var vid=new URLSearchParams(location.search).get('v'), player, ready=false;
function icon(on){
  document.getElementById('pl').style.display=on?'none':'block';
  document.getElementById('pa').style.display=on?'block':'none';
}
function fail(code){
  document.getElementById('pl').style.display='none';
  document.getElementById('pa').style.display='none';
  document.getElementById('er').style.display='block';
  document.getElementById('b').title='Error de YouTube: '+code;
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt',{
    width:320,height:180,videoId:vid,
    playerVars:{controls:0,playsinline:1,rel:0,disablekb:1,modestbranding:1,origin:location.origin},
    events:{
      onReady:function(){ready=true;},
      onStateChange:function(e){icon(e.data===1);},
      onError:function(e){fail(e.data);}
    }
  });
};
document.getElementById('b').addEventListener('click',function(){
  if(!ready)return;
  if(player.getPlayerState()===1)player.pauseVideo();
  else player.playVideo();
});
var s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
</body></html>
